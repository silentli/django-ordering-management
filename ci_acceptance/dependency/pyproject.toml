[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-autofix-acceptance-demo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["PyYAML==6.0.3"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ci_demo*"]
