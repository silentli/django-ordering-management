# menu-nginx-mode: http
# Plain HTTP application configuration. Copy to the active directory as site.conf.
server {
    listen 80;
    server_name localhost;
    client_max_body_size 100M;

    # Re-resolve the Web service through Docker DNS after container replacement.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;

    # Static files
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Media files
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # All other requests go to Django
    location / {
        set $web_backend web:8000;
        proxy_pass http://$web_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
