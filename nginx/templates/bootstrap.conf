# menu-nginx-mode: bootstrap
# Initial HTTP configuration: no certificate or Django backend is required.
# Mount the active configuration directory at /etc/nginx/conf.d and the
# Certbot webroot at /var/www/certbot (both read-only for Nginx).
server {
    listen 80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # Keep application traffic unavailable until HTTPS is configured.
    location / {
        return 503;
    }
}
