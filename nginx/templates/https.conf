# Replace __PUBLIC_HOST__ with the public IPv4 address or domain (no scheme).
# Replace __CERT_NAME__ with the actual Certbot certificate directory name.
# Render into the active configuration directory only after certificates exist.
server {
    listen 80 default_server;
    server_name __PUBLIC_HOST__;

    # Keep HTTP validation available for subsequent renewals.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://__PUBLIC_HOST__$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name __PUBLIC_HOST__;

    ssl_certificate /etc/letsencrypt/live/__CERT_NAME__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__CERT_NAME__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 100M;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        set $web_backend web:8000;
        proxy_pass http://$web_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
