version: '3.8'

services:
  nginx:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media
    depends_on:
      - web
    networks:
      - app_network

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    restart: unless-stopped
    volumes:
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      collect-static:
        condition: service_completed_successfully
    env_file:
      - ../menu_management/settings/env/.env
    environment:
      - DJANGO_SETTINGS_MODULE=menu_management.settings.production
      - DJANGO_ENV=production
    command: gunicorn menu_management.wsgi:application --bind 0.0.0.0:8000
    networks:
      - app_network

  collect-static:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    restart: "no"
    # Existing static volumes may be owned by root from earlier deployments.
    user: "0:0"
    volumes:
      - static_volume:/app/staticfiles
    environment:
      - DJANGO_SETTINGS_MODULE=menu_management.settings.production
    entrypoint: [python, manage.py, collectstatic, --noinput, --clear]
    networks:
      - app_network

  init-admin:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    profiles: [admin]
    restart: "no"
    env_file:
      - ../menu_management/settings/env/.env
      - path: ../.env.admin
        required: false
    environment:
      - DJANGO_SETTINGS_MODULE=menu_management.settings.production
      - DJANGO_ENV=production
    depends_on:
      db:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        : "$${DJANGO_SUPERUSER_USERNAME:?Set DJANGO_SUPERUSER_USERNAME in .env.admin}"
        : "$${DJANGO_SUPERUSER_EMAIL:?Set DJANGO_SUPERUSER_EMAIL in .env.admin}"
        : "$${DJANGO_SUPERUSER_PASSWORD:?Set DJANGO_SUPERUSER_PASSWORD in .env.admin}"
        exec python manage.py createsuperuser --noinput
    networks:
      - app_network

  db:
    image: postgres:14
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ../data:/docker-entrypoint-initdb.d/
    env_file:
      - ../menu_management/settings/env/.env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  static_volume:
  media_volume:
