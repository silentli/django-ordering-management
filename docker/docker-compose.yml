services:
  nginx:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media
      # Prepare site.conf from a template before starting Nginx.
      - type: bind
        source: ../runtime/nginx/conf.d
        target: /etc/nginx/conf.d
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CERTBOT_WEBROOT:-../runtime/certbot/www}
        target: /var/www/certbot
        read_only: true
      - type: bind
        source: ${LETSENCRYPT_DIR:-../runtime/certbot/letsencrypt}
        target: /etc/letsencrypt
        read_only: true
    depends_on:
      web:
        condition: service_healthy
    networks:
      - app_network

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    restart: unless-stopped
    volumes:
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      collect-static:
        condition: service_completed_successfully
    env_file:
      - ../menu_management/settings/env/.env
    environment:
      - DJANGO_SETTINGS_MODULE=menu_management.settings.production
      - DJANGO_ENV=production
    command: gunicorn menu_management.wsgi:application --bind 0.0.0.0:8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import os
          from http.client import HTTPConnection
          host = os.environ.get('ALLOWED_HOSTS', 'localhost').split(',')[0].strip().lstrip('.')
          connection = HTTPConnection('127.0.0.1', 8000, timeout=3)
          connection.request('GET', '/health/', headers={'Host': host if host != '*' else 'localhost'})
          raise SystemExit(0 if connection.getresponse().status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    networks:
      - app_network

  collect-static:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    restart: "no"
    # Existing static volumes may be owned by root from earlier deployments.
    user: "0:0"
    volumes:
      - static_volume:/app/staticfiles
    environment:
      - DJANGO_SETTINGS_MODULE=menu_management.settings.production
    entrypoint: [python, manage.py, collectstatic, --noinput, --clear]
    networks:
      - app_network

  init-admin:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    profiles: [admin]
    restart: "no"
    env_file:
      - ../menu_management/settings/env/.env
      - path: ../.env.admin
        required: false
    environment:
      - DJANGO_SETTINGS_MODULE=menu_management.settings.production
      - DJANGO_ENV=production
    depends_on:
      db:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        : "$${DJANGO_SUPERUSER_USERNAME:?Set DJANGO_SUPERUSER_USERNAME in .env.admin}"
        : "$${DJANGO_SUPERUSER_EMAIL:?Set DJANGO_SUPERUSER_EMAIL in .env.admin}"
        : "$${DJANGO_SUPERUSER_PASSWORD:?Set DJANGO_SUPERUSER_PASSWORD in .env.admin}"
        exec python manage.py createsuperuser --noinput
    networks:
      - app_network

  db:
    image: postgres:14
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ../data:/docker-entrypoint-initdb.d/
    env_file:
      - ../menu_management/settings/env/.env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  static_volume:
  media_volume:
