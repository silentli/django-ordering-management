name: Lint

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - '**/pyproject.toml'
      - '**/ruff.toml'
      - '**/.ruff.toml'
      - '.pre-commit-config.yaml'
      - 'requirements/quality.txt'
      - '.github/workflows/check-lint.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.py'
      - '**/pyproject.toml'
      - '**/ruff.toml'
      - '**/.ruff.toml'
      - '.pre-commit-config.yaml'
      - 'requirements/quality.txt'
      - '.github/workflows/check-lint.yml'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: '0.11.9'
          args: check --output-format=github .
      - uses: astral-sh/ruff-action@v3
        with:
          version: '0.11.9'
          args: format --check .
