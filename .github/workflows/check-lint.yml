name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: '0.11.9'
          args: check --output-format=github .
      - uses: astral-sh/ruff-action@v3
        with:
          version: '0.11.9'
          args: format --check .
