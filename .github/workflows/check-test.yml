name: Test

on:
  push:
    branches: [main]
    paths:
      - 'menu_app/**'
      - 'scripts/**'
      - 'menu_management/**'
      - 'manage.py'
      - 'requirements/**'
      - 'requirements.txt'
      - 'pytest.ini'
      - 'pyproject.toml'
      - '.github/workflows/check-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'menu_app/**'
      - 'scripts/**'
      - 'menu_management/**'
      - 'manage.py'
      - 'requirements/**'
      - 'requirements.txt'
      - 'pytest.ini'
      - 'pyproject.toml'
      - '.github/workflows/check-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    environment: test
    env:
      DJANGO_SETTINGS_MODULE: menu_management.settings.test
      DJANGO_ENV: test
      POSTGRES_DB: menu_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: menu_management
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - '5432:5432'
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
    
    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/test.txt

    - name: Run tests
      run: python -m pytest

    - name: Test host management safeguards
      run: python -m unittest discover -s scripts/tests -v
