name: Package CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    name: package-${{ matrix.project }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project: [logic, discovery, dependency]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download pinned wheels
        run: >-
          python -m pip --isolated download --only-binary=:all: --require-hashes
          --dest "$RUNNER_TEMP/package-wheels"
          -r ci_acceptance/build-tools.lock -r ci_acceptance/dependencies.lock
      - name: Build, clean install and test the selected package
        run: >-
          python ci_acceptance/run.py "${{ matrix.project }}"
          --wheelhouse "$RUNNER_TEMP/package-wheels"
